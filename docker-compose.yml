version: '3.8'

services:
  app:
    build: .
    ports:
      - "8086:8086"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - FRAPPE_API_URL=${FRAPPE_API_URL:-https://sandbox.privacycard.in/api/method}
      - FRAPPE_API_KEY=${FRAPPE_API_KEY:-f40fe7d10df6fe7:b04f22b862fa9c6}
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:6.2-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data: