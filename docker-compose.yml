services:
  app:
    build: .
    ports:
      - "8086:8086"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file:
      - .env.${ENVIRONMENT:-development}
    depends_on:
      - redis
    restart: unless-stopped
  
  redis:
    image: redis:6.2-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    restart: unless-stopped

volumes:
  redis_data: